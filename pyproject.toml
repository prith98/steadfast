[project]
name = "steadfast"
version = "0.1.0.dev0"
description = "Reliability benchmarking for AI agents."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Prith Jaganathan", email = "prith98@gmail.com" }]
keywords = [
    "ai",
    "agents",
    "evaluation",
    "reliability",
    "benchmark",
    "opentelemetry",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "agentevals>=0.0.7",
    "aiosqlite>=0.20",
    "anthropic>=0.40",
    "google-genai>=0.5",
    "jsonschema>=4.20",
    "numpy>=1.26",
    "openai>=1.50",
    "opentelemetry-api>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
    "opentelemetry-sdk>=1.27",
    "pydantic>=2.9",
    "scipy>=1.13",
    "tenacity>=8.5",
    "typer>=0.12",
]

[project.scripts]
steadfast = "steadfast.cli:main"

[project.urls]
Documentation = "https://github.com/prith98/steadfast/tree/main/docs"
Issues = "https://github.com/prith98/steadfast/issues"
Repository = "https://github.com/prith98/steadfast"

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/steadfast"]

# Ship the frozen prompt files (``prompts/rubric_v1.txt`` and future
# ``prompts/paraphrase_v1.txt`` etc.) inside the wheel so judges resolve
# them via importlib.resources. The repo root directory ``prompts/`` is
# the canonical location per ``docs/METHODOLOGY.md`` §"Versioning"; the
# wheel duplicates it under the ``steadfast`` package namespace.
[tool.hatch.build.targets.wheel.force-include]
"prompts" = "steadfast/prompts"

[tool.hatch.build.targets.sdist]
include = [
    "src/steadfast",
    "prompts",
    "docs",
    "benchmarks",
    "CHANGELOG.md",
    "CLAUDE.md",
    "CONTRIBUTING.md",
    "LICENSE",
    "README.md",
    "pyproject.toml",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "SIM", # flake8-simplify
    "PT",  # flake8-pytest-style
    "RUF", # ruff-specific
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["scipy.*", "google.genai.*", "agentevals.*", "jsonschema.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = ["-ra", "--strict-markers"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "live: marks tests that hit live LLM APIs (deselect by default)",
]
