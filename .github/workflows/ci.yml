name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-type-test:
    name: Lint, type-check, test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        # ``astral-sh/setup-uv`` publishes moving major tags up to ``v7``;
        # ``v8`` only has point releases (v8.0.0 / v8.1.0) and no moving
        # major tag. Pinning to ``v7`` keeps the moving-major convention
        # used for ``actions/checkout@v6``; v7 already runs on Node 24 (the
        # 2026-06-02 deadline driver per auto-memory), so the Node 24
        # objective is satisfied without the unresolvable ``@v8`` tag.
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --dev

      - name: ruff format --check
        run: uv run ruff format --check

      - name: ruff check
        run: uv run ruff check

      - name: mypy --strict
        run: uv run mypy src/

      - name: pytest
        run: uv run pytest -m "not slow and not live"
